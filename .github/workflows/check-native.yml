name: check-native

# rosetta/native.index and rosetta/native.exclude must agree with rosetta/native/
# (decimal128-workorder NativeCorpusExclusionWorkOrder.md D-5).

on:
  push:
  pull_request:

jobs:
  check-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 rosetta/check_native.py
